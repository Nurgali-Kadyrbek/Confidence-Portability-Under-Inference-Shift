[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cpis"
version = "0.1.0"
description = "Confidence portability under inference-configuration shift"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
scoring = [
  "absl-py==2.3.1",
  "immutabledict==4.2.2",
  "langdetect==1.0.9",
  "nltk==3.9.2",
  "pylint==2.17.7",
]

[project.scripts]
cpis = "cpis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cpis"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
