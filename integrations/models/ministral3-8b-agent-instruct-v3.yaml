validation_status: development_validated
validation_evidence: Paired-ID native run dev-agent-preflight-ministral3-8b-instruct-bfcl-v2-b3e90757f2cc
  completed 8 episodes, 117 answer steps, and 16 confidence calls. Seven episodes passed the pinned official
  BFCL evaluator. One malformed native tool output is retained as an unsuccessful episode. There were
  no force terminations, length finishes, or invalid confidence records. All records contain the required
  condition-invariant tool-call pairing identity. Parser v2 additionally mirrors the pinned native renderer's
  tool-name grammar. Its regression fixture is the development-observed Unicode-suffixed name that terminated
  the rejected full-run attempt; the corrected parser classifies it as an invalid unsuccessful episode
  before transcript rendering.
