parameter_count_method: Exact pinned safetensors index metadata; language model is 8,489,553,920 parameters.
architecture: Mistral3 8B-class dense Instruct checkpoint, language-model-only, 34 text layers and GQA.
framework: vLLM CUDA native Mistral tool inference, language-model-only, no offload
framework_version: 0.29.0+cu129
framework_requirement: Official card requires vLLM >=0.12, mistral-common >=1.8.6, native Mistral loading,
  enable-auto-tool-choice, and the mistral tool parser.
precision:
- bfloat16
official_chat_template_sha256: 74eeb55fd3341286ec3fd44e902b7120721acc81cd394e96b431f85e93a1ea56
message_format: Render OpenAI-format messages and tools with the native Mistral tokenizer and pass token
  IDs directly to vLLM. v11+ calls use [TOOL_CALLS]name[ARGS]{json}; assistant tool_calls and nine-character
  tool_call_id responses are preserved. CPIS tool-call IDs are paired by model, item, and replicate seed
  while each decoder condition retains an isolated simulator namespace.
reasoning_controls: This Instruct checkpoint has no reasoning-trace mode and must remain instruct.
required_special_tokens:
- <s>
- </s>
- <pad>
- '[SYSTEM_PROMPT]'
- '[/SYSTEM_PROMPT]'
- '[INST]'
- '[/INST]'
- '[TOOL_CALLS]'
- '[ARGS]'
eos_and_stop_behavior: Generation EOS is 2; no explicit stop strings, ignore_eos=false, preserve finish
  reasons.
recommended_context_limit: 262144
configured_context_limit: 65536
recommended_output_limits: Validated limits are 1,024 tokens per agent step and 256 for confidence. The
  paired native preflight observed maxima of 313 and 14 tokens respectively, with no length finish and
  no force termination.
native_reference_sampling:
  temperature: 0.05
  top_p: 1.0
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  repetition_penalty: 1.0
sampler_constraints: Official production guidance is below 0.1; top-k and min-p filtering remain disabled.
greedy_decoding_caveats: Greedy is a labeled standardized confidence readout, not the native agent reference.
tool_calling_requirements: Use native Mistral token-ID rendering with the minimal BFCL tools and strict
  v11+ parser. Never retokenize rendered native prompts or repair tool arguments. Tool message IDs must
  use cpis-agent-tool-call-pair-v1 and exclude decoder condition from their identity. Tool names are accepted
  only when they match the native renderer's ^[a-zA-Z0-9_-]{1,64}$ contract; violations are malformed
  tool outputs.
structured_output_constraints: Native function envelopes are exact; confidence is prompt-level JSON without
  guided decoding.
engine_requirements: CUDA-only vLLM 0.29.0+cu129, mistral-common 1.11.7, Transformers 5.16.1, native Mistral
  formats, spawned worker, BF16, TP=1, one L40, no offload.
unsupported_configurations:
- HF-text retokenization of a native Mistral prompt
- Generic non-Mistral tool parser or reasoning mode
- Condition-specific tool-call message IDs in a paired decoder comparison
- Context truncation or CPU/NVMe parameter offload
- Tool-call names outside ^[a-zA-Z0-9_-]{1,64}$
