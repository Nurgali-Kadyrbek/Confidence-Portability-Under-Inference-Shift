license_and_access: >-
  Public official Hugging Face dataset under the MIT license and without an
  authentication gate. CPIS uses only the text-only files and downloads no
  medical images.
official_splits: >-
  The Text subset contains an official five-example few-shot development file
  and a 2,450-question test file. CPIS excludes the five prompt demonstrations
  and freezes internal development/certification/test partitions of the complete
  official Text test file before any model outcome is observed.
unit_of_observation: >-
  One text medical multiple-choice question identified by its official Text-N
  ID. Decoder conditions and replicate generations are repeated measurements of
  that question.
grouping_and_dependence: >-
  Questions are stratified by official medical_task, body_system, and
  question_type metadata. Resampling clusters on the original question ID and
  carries every decoder condition and seed with the sampled item.
official_task_representation: >-
  The official question string already contains the A--J answer choices. CPIS
  preserves that string byte-for-byte after JSON decoding and preserves the
  official option order; success is selecting the source label.
official_scoring: >-
  Deterministic exact match to the official label field. The official release
  provides labels rather than a separate evaluator, so CPIS tests the direct
  field comparison and does not use an LLM judge.
allowed_normalization: >-
  Strip surrounding whitespace and compare the option letter case-insensitively.
  No semantic answer mapping, option reordering, or partial credit is permitted.
invalid_output_handling: >-
  An answer that cannot be parsed as terminal answer JSON is incorrect. Invalid
  confidence is forced abstention operationally and separately reported.
evaluation_type: deterministic answer-letter evaluation; no model judge
duplicate_and_transformed_relationships: >-
  Official IDs are unique and CPIS creates no derived question variants. Any
  repeated generations remain clustered by the original Text-N ID.
contamination_considerations: >-
  The benchmark is public and its questions were collected from public medical
  examinations before expert review and rephrasing, so pretraining contamination
  cannot be ruled out. CPIS makes paired within-item decoder contrasts and does
  not interpret raw accuracy as contamination-free.
benchmark_exclusions: >-
  The five official few-shot development examples are excluded by design because
  EXPERIMENT.md defines the 2,450-question Text set. Preparation rejects schema
  deviations, duplicate IDs, missing A--J options, invalid labels, or missing
  official task/system/type metadata; no row in the official Text test file is
  otherwise excluded.
evaluator_revision: cpis-exact-match-casefold-v1
preparation_algorithm: >-
  official-strata-exact-40-30-30-v1 with salt
  medxpertqa-text-official-strata-v1: deterministically balance official
  medical_task x body_system x question_type strata while enforcing exact
  980/735/735 internal partition totals.
