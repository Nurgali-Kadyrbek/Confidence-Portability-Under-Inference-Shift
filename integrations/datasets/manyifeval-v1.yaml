license_and_access: >-
  Public, unauthenticated official GitHub repository. It does not declare a
  top-level dataset license, although inherited IFEval evaluator files carry
  Apache-2.0 notices. CPIS stores the source and prepared prompts only on RAID,
  cites the authors, and does not redistribute benchmark content in Git.
official_splits: >-
  The official release is one flat 2,160-row JSONL file with no held-out split.
  It contains ten instruction-load variants for each of 216 base prompts. CPIS
  assigns whole base-prompt groups to frozen internal partitions before model use.
unit_of_observation: >-
  The independent unit is the original base prompt identified by source key.
  Its ten instruction-load variants, decoder conditions, and seeds are repeated
  clustered observations rather than independent samples.
grouping_and_dependence: >-
  Every source key has exactly one variant at each instruction count 1--10. All
  variants remain in one partition and final resampling clusters by source key.
official_task_representation: >-
  Use the official prompt field verbatim as the user task and retain the full
  response without JSON wrapping. The scoring payload preserves instruction IDs
  and kwargs required by the pinned evaluator.
official_scoring: >-
  Use the pinned official strict evaluator, not its loose upper-bound variant.
  Binary success requires follow_all_instructions=true. Instruction-level
  satisfaction is retained as a secondary continuous outcome.
allowed_normalization: >-
  No response normalization before strict evaluation. The official individual
  checks may inspect whitespace, punctuation, casing, words, and formatting, so
  the generated response is preserved byte-for-byte after decoding.
invalid_output_handling: >-
  Empty answers are invalid and unsuccessful. A nonempty response is passed to
  every official instruction checker. Invalid confidence is forced abstention
  operationally and separately reported.
evaluation_type: deterministic official rule-based evaluation; no model judge
duplicate_and_transformed_relationships: >-
  The 2,160 rows are derived from 216 base prompts by increasing instruction
  load. Prepared IDs are unique, but all variants cluster on the source key.
contamination_considerations: >-
  ManyIFEval and its IFEval source are public, so contamination cannot be ruled
  out. CPIS estimates paired decoder effects on identical prompts and will not
  make contamination-free capability claims from raw success rates.
benchmark_exclusions: >-
  No official row is excluded. Preparation rejects schema changes, missing load
  levels, mismatched instruction/kwargs arrays, or anything other than exactly
  216 complete ten-variant base groups.
evaluator_revision: 5c1ba29e631e2bbee981ebd620898c2750c5ddbf:strict
preparation_algorithm: >-
  group-preserving-hash-40-30-30-v1 with salt manyifeval-base-key-split-v1;
  deterministic hashing assigns 86 base keys to development and 65 each to
  certification/test, carrying all ten variants with their base key.
